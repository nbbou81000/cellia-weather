  html, body {

  .screen {

  .header {

    padding-bottom: 8px;

  .temp-block.right { justify-content: flex-end; text-align: right; }
  .temp-label { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; align-self: center; }
  .temp-value { font-size: 54px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .temp-value .unit { font-size: 24px; font-weight: 400; margin-left: 2px; }
  .temp-sub { font-size: 12px; align-self: center; color: #000; }
  .divider-v { width: 3px; align-self: stretch; background: #000; margin: 0 20px; }

  .stats-strip {
    display: flex;
    border-top: 2px solid #000;
    border-bottom: 2px solid #000;
    padding: 6px 0;
    margin-bottom: 10px;
  }
  .stat-mini { flex: 1; text-align: center; border-right: 1px solid #000; font-size: 13px; }
  .stat-mini:last-child { border-right: none; }
  .stat-mini b { font-weight: 700; }

  .charts { display: flex; flex: 1; gap: 14px; min-height: 0; }
  .chart-box { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chart-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .chart-range { font-size: 10px; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .chart-box canvas { flex: 1; width: 100%; display: block; }

<script>
  function dewPoint(tempC, rh) {
    const a = 17.27, b = 237.7;
    const alpha = ((a * tempC) / (b + tempC)) + Math.log(rh / 100);
    return (b * alpha) / (a - alpha);
  }

  // Reproduit la logique wxCond() (version sans tendance de pression)
  function wxCond(to, ho) {
    if (ho > 90) return 'Temps pluvieux probable';
    if (ho > 88) return 'Tres humide';
    if (to > 28 && ho < 55) return 'Chaud et ensoleille';
    if (to < 3) return 'Temps froid';
    if (to > 20 && ho < 70) return 'Beau temps';
    return 'Conditions stables';
  }

  function fmtHM(ts) {
    return new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }
  function fmtDay(ts) {
    return new Date(ts).toLocaleDateString('fr-FR', { weekday: 'short' });
  }

  function drawLineChart(canvas, series, labels, opts) {
    opts = opts || {};
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, w, h);

    const padTop = 14, padBottom = 16, padLeft = 4, padRight = 4;
    const plotW = w - padLeft - padRight, plotH = h - padTop - padBottom;

    let allVals = [];
    series.forEach(s => { allVals = allVals.concat(s.values.filter(v => v != null)); });
    if (!allVals.length) return;

    let min = Math.min(...allVals), max = Math.max(...allVals);
    if (min === max) { min -= 1; max += 1; }
    const margin = (max - min) * 0.1;
    min -= margin; max += margin;

    const n = labels.length;
    function xAt(i) { return padLeft + (n <= 1 ? 0 : (i / (n - 1)) * plotW); }
    function yAt(v) { return padTop + plotH - ((v - min) / (max - min)) * plotH; }

    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padLeft, padTop + plotH);
    ctx.lineTo(padLeft + plotW, padTop + plotH);
    ctx.stroke();

    ctx.fillStyle = '#000';
    ctx.font = '10px Helvetica Neue, Arial, sans-serif';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText((opts.fmt ? opts.fmt(max) : max.toFixed(1)), padLeft, 0);
    ctx.textBaseline = 'bottom';
    ctx.fillText((opts.fmt ? opts.fmt(min) : min.toFixed(1)), padLeft, h);

    series.forEach(s => {
      ctx.beginPath();
      ctx.lineWidth = 2.4;
      ctx.setLineDash(s.dash ? [6, 4] : []);
      let started = false;
      for (let i = 0; i < n; i++) {
        const v = s.values[i];
        if (v == null) { started = false; continue; }
        const x = xAt(i), y = yAt(v);
        if (!started) { ctx.moveTo(x, y); started = true; }
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    });
    ctx.setLineDash([]);
  }

  function render() {
    if (typeof EINK_DATA === 'undefined') {
      document.getElementById('updated').textContent = 'Donnees manquantes';
      document.getElementById('charts').innerHTML =
        '<div class="chart-unavailable">EINK_DATA non injecte - verifier generate-eink.js</div>';
      return;
    }

    const data = EINK_DATA.current || {};
    const ext = data.outdoor || {};
    const intr = data.indoor || {};

    document.getElementById('place').textContent =
      (data.place && data.place.city) ? ' \u00b7 ' + data.place.city : '';

    const updatedDate = data.last_updated ? new Date(data.last_updated) : null;
    document.getElementById('updated').textContent = updatedDate
      ? updatedDate.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
      : '--:--';

    if (typeof ext.temperature === 'number') {
      document.getElementById('ext-temp').innerHTML = ext.temperature.toFixed(1) + '<span class="unit">&deg;C</span>';
    }
    if (typeof ext.humidity === 'number') {
      document.getElementById('ext-sub').textContent = 'Hum. ' + ext.humidity + '%';
    }
    if (typeof intr.temperature === 'number') {
      document.getElementById('int-temp').innerHTML = intr.temperature.toFixed(1) + '<span class="unit">&deg;C</span>';
    }
    if (typeof intr.humidity === 'number') {
      document.getElementById('int-sub').textContent = 'Hum. ' + intr.humidity + '%';
    }
    if (typeof intr.pressure === 'number') {
      document.getElementById('pressure').textContent = intr.pressure.toFixed(1) + ' hPa';
    }
    if (typeof ext.temperature === 'number' && typeof ext.humidity === 'number') {
      document.getElementById('dewpoint').textContent = dewPoint(ext.temperature, ext.humidity).toFixed(1) + '\u00b0C';
      document.getElementById('condition').textContent = wxCond(ext.temperature, ext.humidity);
    }
    if (typeof intr.co2 === 'number') {
      document.getElementById('co2').textContent = intr.co2 + ' ppm';
    }
    if (typeof intr.noise === 'number') {
      document.getElementById('noise').textContent = intr.noise + ' dB';
    }
    if (typeof ext.temperature === 'number' && typeof intr.temperature === 'number') {
      const delta = intr.temperature - ext.temperature;
      document.getElementById('delta').textContent = (delta >= 0 ? '+' : '') + delta.toFixed(1) + '\u00b0C';
    }

    const t24 = EINK_DATA.temp24 || [];
    const p24 = EINK_DATA.press24 || [];
    const t7 = EINK_DATA.temp7 || [];

    if (t24.length > 1) {
      drawLineChart(
        document.getElementById('chart-temp24'),
        [
          { values: t24.map(e => e.out), dash: false },
          { values: t24.map(e => e.in), dash: true }
        ],
        t24.map(e => e.t),
        { fmt: v => v.toFixed(1) + '\u00b0' }
      );
      document.getElementById('range-temp24').textContent =
        '(' + fmtHM(t24[0].t) + ' \u2192 ' + fmtHM(t24[t24.length - 1].t) + ')';
    } else {
      document.getElementById('chart-temp24').parentElement.innerHTML =
        '<div class="chart-title">Temperature 24h</div><div class="chart-unavailable">Pas assez de donnees</div>';
    }

    if (t7.length > 1) {
      drawLineChart(
        document.getElementById('chart-temp7'),
        [{ values: t7.map(e => e.out), dash: false }],
        t7.map(e => e.t),
        { fmt: v => v.toFixed(1) + '\u00b0' }
      );
      document.getElementById('range-temp7').textContent =
        '(' + fmtDay(t7[0].t) + ' \u2192 ' + fmtDay(t7[t7.length - 1].t) + ')';
    } else {
      document.getElementById('chart-temp7').parentElement.innerHTML =
        '<div class="chart-title">Temperature 7 jours</div><div class="chart-unavailable">Pas assez de donnees</div>';
    }

    if (p24.length > 1) {
      drawLineChart(
        document.getElementById('chart-press'),
        [{ values: p24.map(e => e.p), dash: false }],
        p24.map(e => e.t),
        { fmt: v => v.toFixed(0) }
      );
      document.getElementById('range-press').textContent =
        '(' + fmtHM(p24[0].t) + ' \u2192 ' + fmtHM(p24[p24.length - 1].t) + ')';
    } else {
      document.getElementById('chart-press').parentElement.innerHTML =
        '<div class="chart-title">Pression 24h</div><div class="chart-unavailable">Pas assez de donnees</div>';
    }
  }

  render();
